<section id="panel-devotional" role="main" aria-label="Devotional Videos">
  @for (section of visibleSections(); track section.key) {
    <section class="deity-section mb-5" [attr.aria-label]="section.ariaLabel">
      <h2 class="deity-heading mb-4">
        <i class="bi me-2" [class]="section.iconClass" aria-hidden="true"></i>
        {{ section.label }}
      </h2>
      @defer (on viewport) {
        <div class="row">
          @for (item of section.videos; track item.id) {
            <app-video-card [item]="item" />
          }
        </div>
      } @placeholder {
        <app-video-cards-skeleton />
      }
    </section>
  }
</section>
